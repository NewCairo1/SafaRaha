<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafaRaha</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --teal:#0F766E; --teal-dark:#115E59; --teal-soft:#CCFBF1; --teal-tint:#F0FDFA;
  --cta:#C2410C; --cta-dark:#9A3412; --booked:#9A3412;
  --sand:#FAF7F2; --ink:#0F172A; --muted:#57534E; --line:#E7E5E4; --field:#D6D3D1;
  --card:#FFFFFF; --photo:#E7E2D9; --wa:#25D366; --wa-ink:#052E16;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sand);color:var(--ink);font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
[dir=rtl] body{line-height:1.6}
a{color:var(--teal)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid #0EA5E9;outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}

.demo{background:var(--ink);color:#F5F5F4;font-size:13px;text-align:center;padding:8px 16px}

.top{background:var(--sand);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:64px;padding-top:8px;padding-bottom:8px}
.logo{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--teal);text-decoration:none}
.logo span{color:var(--cta)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto;align-items:center}
.nav a{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:15px}
.nav a.on{color:var(--teal);font-weight:600}
.nav a.btn-out{border:1px solid var(--teal);color:var(--teal);font-weight:500}
.switch{height:40px;border:1px solid var(--field);border-radius:10px;background:#fff;padding:0 8px;font-size:14px;color:var(--ink)}
@media (max-width:640px){.nav .hide-s{display:none}.logo{font-size:22px}}

.btn{min-height:52px;border:none;border-radius:14px;background:var(--cta);color:#fff;font-size:16px;font-weight:600;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--cta-dark)}
.btn.teal{background:var(--teal)}.btn.teal:hover{background:var(--teal-dark)}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.ghost:hover{background:var(--teal-tint)}
.btn.plain{background:#fff;color:var(--ink);border:1px solid var(--field)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#44403C}
.field select,.field input{height:50px;border:1px solid var(--field);border-radius:12px;padding:0 12px;font-size:16px;color:var(--ink);background:#fff;width:100%}
.check{min-height:44px;display:flex;align-items:center;gap:12px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal);flex-shrink:0}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--field);background:#fff;display:inline-flex;align-items:center;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal-dark);font-size:12px;font-weight:600}
.card{background:var(--card);border-radius:var(--r)}

.hero{padding:40px 0 8px}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.15;font-weight:700;max-width:760px}
.hero p{margin-top:14px;font-size:clamp(15px,1.6vw,18px);color:var(--muted);max-width:620px}
.search{margin-top:24px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(15,23,42,.08);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.search .btn{width:100%}
.section{padding-top:36px}
.section h2{font-size:20px;font-weight:600;margin-bottom:14px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.trust .card{padding:20px;display:flex;gap:14px;align-items:flex-start}
.ico{width:44px;height:44px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.trust h3{font-size:16px;font-weight:600}
.trust p{font-size:14px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.car{display:block;background:#fff;border-radius:18px;overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:0 2px 10px rgba(15,23,42,.06);transition:transform .15s,box-shadow .15s}
.car:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.1)}
.photo{background:var(--photo);color:#78716C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;font-size:12px}
.car .photo{height:180px}
.car .photo .badge{position:absolute;top:12px;inset-inline-start:12px;background:#fff;color:var(--teal)}
.car .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.car .name{font-size:16px;font-weight:600}
.car .specs{font-size:13px;color:var(--muted)}
.car .extra{font-size:13px;color:#44403C}
.car .foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.car .owner{font-size:12px;color:var(--muted)}
.price{white-space:nowrap}
.price b{font-size:18px;color:var(--teal)}.price small{font-size:12px;color:var(--muted)}
.band{margin-top:44px;background:var(--teal);color:#fff;border-radius:24px;padding:32px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.band h2{font-size:26px;font-weight:700}
.band p{color:var(--teal-soft);margin-top:8px;max-width:620px}
.band .btn{background:#fff;color:var(--teal)}
footer.foot{padding:40px 0 32px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px 24px}

.bar{padding:16px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar h1{font-size:clamp(18px,2.4vw,24px);font-weight:600}
.results{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-bottom:40px}
.filters{flex:1 1 260px;max-width:100%;padding:20px;display:flex;flex-direction:column;gap:16px}
.filters h2{font-size:17px;font-weight:600}
.filters fieldset{border:none;margin:0;padding:0}
.filters legend{font-size:13px;font-weight:500;color:#44403C;margin-bottom:4px}
.list{flex:999 1 560px;min-width:0}
.open-filters{display:none}
.empty{padding:24px;color:var(--muted)}
@media (max-width:860px){
  .filters{display:none;position:fixed;inset:auto 0 0 0;z-index:40;border-radius:24px 24px 0 0;max-height:85vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(15,23,42,.2)}
  .filters.open{display:flex}
  .open-filters{display:inline-flex}
  .veil{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:39}
}

.back{min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:15px;margin:12px 0}
.detail{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;padding-bottom:120px}
.detail .main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.detail aside{flex:1 1 300px}
.gallery{height:clamp(240px,40vw,420px);border-radius:20px;overflow:hidden}
.gallery .nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:none;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gallery .prev{inset-inline-start:12px}.gallery .next{inset-inline-end:12px}
.gallery .count{position:absolute;bottom:12px;inset-inline-end:12px;background:rgba(15,23,42,.75);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px}
.title h1{font-size:clamp(22px,3vw,30px);font-weight:700;margin-top:6px}
.title .sub{color:var(--muted);font-size:15px}
.owner-card{padding:14px;display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:999px;background:var(--teal);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.specgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.specgrid div{background:#fff;border-radius:12px;padding:10px 12px}
.specgrid small{display:block;font-size:12px;color:var(--muted)}
.specgrid span{font-size:14px;font-weight:500}
.rows{padding:4px 16px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #F5F5F4;font-size:14px}
.rows div:last-child{border-bottom:none}
.rows span:first-child{color:var(--muted)}
.rows span:last-child{font-weight:500;text-align:end}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px}
.cal{padding:14px}
.cal .head,.cal .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .head span{text-align:center;font-size:11px;color:var(--muted);margin-bottom:6px}
.day{height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid transparent;background:none}
.day.booked{color:#A8A29E;text-decoration:line-through;background:#F5F5F4}
.day.mine{background:var(--teal);color:#fff;font-weight:600}
.day.clash{background:var(--booked);color:#fff;font-weight:600;text-decoration:line-through}
.contract{padding:16px;border-radius:16px;background:var(--teal-tint);border:1px solid #99F6E4;display:flex;gap:12px}
.contract b{color:#134E4A}.contract p{font-size:14px;color:var(--teal-dark);margin-top:4px}
.book{position:sticky;top:96px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
.book .total{font-size:22px;font-weight:700}
.wa{min-height:52px;border:none;border-radius:14px;background:var(--wa);color:var(--wa-ink);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.wa:hover{filter:brightness(.95)}
.mbar{display:none}
@media (max-width:860px){
  .detail aside{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));gap:12px;align-items:center}
  .mbar .wa{width:auto;padding:0 18px}
}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:20px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.bubble{background:#DCF8C6;border-radius:12px;padding:12px 14px;font-size:15px;white-space:pre-line}

.pro{display:flex;flex-wrap:wrap;min-height:calc(100vh - 110px)}
.side{flex:1 1 220px;max-width:100%;background:#fff;border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side .who{padding:0 8px 14px;font-size:14px;color:var(--muted)}
.side .who b{display:block;color:var(--ink);font-size:16px}
.side a{min-height:44px;padding:0 12px;border-radius:10px;display:flex;align-items:center;text-decoration:none;color:var(--ink);font-size:15px}
.side a.on{background:var(--teal-tint);color:var(--teal);font-weight:600}
.pro main{flex:999 1 560px;min-width:0;padding:24px 20px 60px;display:flex;flex-direction:column;gap:20px}
@media (max-width:760px){.side{flex-direction:row;overflow-x:auto;padding:8px;gap:4px;border-inline-end:none;border-bottom:1px solid var(--line)}.side .who{display:none}.side a{white-space:nowrap}}
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.phead h1{font-size:clamp(20px,2.6vw,26px);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats .card{padding:14px 16px}
.stats small{font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:24px;margin-top:4px}
.legend{display:flex;gap:16px;font-size:13px;color:#44403C;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:6px}
.fleet{overflow-x:auto}
.fleet table{border-collapse:separate;border-spacing:3px;min-width:max-content}
.fleet th{font-size:11px;font-weight:400;color:var(--muted);text-align:center}
.fleet th.v{text-align:start;font-size:14px;font-weight:500;color:var(--ink);padding-inline-end:10px;white-space:nowrap;position:sticky;inset-inline-start:0;background:#fff;z-index:1}
.cell{width:26px;height:36px;border-radius:6px;border:1px solid var(--line);background:#F5F5F4;cursor:pointer;padding:0;display:block}
.cell.on{background:var(--booked);border-color:var(--booked)}
.daybtn{height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
.daybtn.on{background:var(--booked);border-color:var(--booked);color:#fff;font-weight:600}
.only-d{display:block}.only-m{display:none}
@media (max-width:760px){.only-d{display:none}.only-m{display:block}}

.wizard{max-width:640px;width:100%;display:flex;flex-direction:column;gap:18px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps span{height:6px;border-radius:6px;background:var(--line)}
.steps span.on{background:var(--teal)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.auto{padding:14px;background:var(--teal-tint);border:1px solid #99F6E4;border-radius:16px}
.auto p{font-size:14px;font-weight:600;color:#134E4A;margin-bottom:8px}
.auto div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border-radius:12px;border:2px dashed var(--field);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:12px;color:#78716C;background:none;cursor:pointer}
.slot.done{border:none;background:var(--photo);color:#44403C}
.wfoot{display:flex;gap:10px}
.wfoot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="demo" id="demo"></div>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/" id="logo">Safa<span>Raha</span></a>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<div id="app"></div>
<div id="layer"></div>

<script>
/* =========================================================
   Langue et pays
   ========================================================= */
const LANGS = ['fr','ar','en'];
let lang = 'fr', country = 'dz';
(function init(){
  const q = new URLSearchParams(location.search);
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('safaraha') || '{}'); } catch(e) {}
  const l = q.get('lang') || saved.lang; if (LANGS.includes(l)) lang = l;
  const c = q.get('pays') || q.get('country') || saved.country; if (c === 'dz' || c === 'eg') country = c;
})();
const I = () => LANGS.indexOf(lang);

/* Textes : [français, arabe, anglais] */
const T = {
  demo:["Maquette de démonstration — données et agences fictives, prix à compléter","نسخة تجريبية للعرض — البيانات والوكالات وهمية، والأسعار ستُضاف لاحقًا","Demo prototype — sample data and fictional agencies, prices to be added"],
  navRent:["Louer une voiture","استأجر سيارة","Rent a car"],
  navPro:["Espace loueur","مساحة المؤجِّر","Owner area"],
  langLabel:["Langue","اللغة","Language"], countryLabel:["Pays","البلد","Country"],
  dz:["Algérie","الجزائر","Algeria"], eg:["Égypte","مصر","Egypt"],
  heroT:["Louez une voiture en toute sérénité","استأجر سيارتك براحة بال","Rent a car with peace of mind"],
  heroP:["Des loueurs vérifiés à {city}, des disponibilités à jour et un contrat standard pour chaque location.","مؤجِّرون موثَّقون في {city}، ومواعيد إتاحة محدَّثة، وعقد موحَّد لكل عملية إيجار.","Verified rental owners in {city}, up-to-date availability and a standard contract for every rental."],
  city:["Ville","المدينة","City"], from:["Départ","تاريخ الاستلام","Pick-up"], to:["Retour","تاريخ الإرجاع","Return"],
  type:["Type de véhicule","نوع السيارة","Vehicle type"], allTypes:["Tous les types","كل الأنواع","All types"],
  search:["Rechercher","ابحث","Search"], byCat:["Par catégorie","حسب الفئة","By category"],
  t_city:["Citadine","سيارة صغيرة","City car"], t_sedan:["Berline","سيدان","Sedan"], t_estate:["Break","ستيشن","Estate"],
  t_suv:["SUV","دفع رباعي (SUV)","SUV"], t_seven:["7-8 places","7 - 8 مقاعد","7-8 seats"], t_utility:["Utilitaire","نقل وميني باص","Utility / van"],
  withDriver:["Avec chauffeur","مع سائق","With driver"], withoutDriver:["Sans chauffeur","بدون سائق","Without driver"],
  tr1T:["Loueurs vérifiés","مؤجِّرون موثَّقون","Verified owners"],
  tr1:["Agences et particuliers contrôlés avant de publier, avec un badge Pro ou Particulier.","نتحقق من الوكالات والأفراد قبل النشر، مع شارة «محترف» أو «فرد».","Agencies and individuals are checked before publishing, with a Pro or Individual badge."],
  tr2T:["Contrat SafaRaha","عقد صفا راحة","SafaRaha contract"],
  tr2:["Le même contrat équilibré pour toutes les locations, prérempli avec les conditions de l'annonce.","نفس العقد المتوازن لكل عمليات الإيجار، مُعبّأ مسبقًا بشروط الإعلان.","The same balanced contract for every rental, pre-filled with the listing's terms."],
  tr3T:["Contact direct","تواصل مباشر","Direct contact"],
  tr3:["Vous échangez avec le loueur sur WhatsApp, sans intermédiaire.","تتواصل مع المؤجِّر مباشرة عبر واتساب دون وسيط.","You talk to the owner directly on WhatsApp, with no middleman."],
  avail:["Disponibles du {a} au {b} {m} à {city}","متاحة من {a} إلى {b} {m} في {city}","Available {m} {a}–{b} in {city}"],
  bandT:["Vous louez des voitures ?","هل تؤجِّر سيارات؟","Do you rent out cars?"],
  bandP:["Publiez vos véhicules depuis votre téléphone, gérez vos disponibilités en deux clics et recevez des clients sur WhatsApp. Nous nous occupons de la publicité.","انشر سياراتك من هاتفك، وأدِر مواعيد الإتاحة بنقرتين، واستقبل العملاء عبر واتساب. ونحن نتولى الإعلان.","List your cars from your phone, manage availability in two taps and get customers on WhatsApp. We take care of the advertising."],
  bandBtn:["Découvrir l'espace loueur","اكتشف مساحة المؤجِّر","Explore the owner area"],
  foot:["© SafaRaha — maquette","© صفا راحة — نسخة تجريبية","© SafaRaha — prototype"],
  terms:["Conditions d'utilisation","شروط الاستخدام","Terms of use"], privacy:["Confidentialité","الخصوصية","Privacy"], contractModel:["Modèle de contrat","نموذج العقد","Contract template"],
  photos:["Photos du véhicule","صور السيارة","Vehicle photos"], verified:["vérifié","موثَّق","verified"],
  perDay:[" /jour"," / اليوم"," /day"], seats:["places","مقاعد","seats"],
  pro:["Pro","محترف","Pro"], part:["Particulier","فرد","Individual"],
  auto:["Automatique","أوتوماتيك","Automatic"], manual:["Manuelle","مانيوال","Manual"],

function setPrefs(l, c){
  const changedCountry = c !== country;
  lang = l; country = c;
  try { localStorage.setItem('safaraha', JSON.stringify({lang, country})); } catch(e) {}
  const q = new URLSearchParams(location.search); q.set('lang', lang); q.set('pays', country);

  route();
}

function planningBind(){
  const fleet = FLEET[country];
  if (current >= fleet.length) current = 0;
  const toggle = (v,d) => {const b=fleet[v].booked; const k=b.indexOf(d); k>=0?b.splice(k,1):b.push(d); draw();};
  const draw = () => {
    $('#st-n').textContent = fleet.length;

    let h = `<table><thead><tr><th class="v">${t('carCol')}</th>`;

    h += '</tr></thead><tbody>';
    fleet.forEach((f,v) => {
      h += `<tr><th class="v" scope="row"><bdi>${esc(f.name)}</bdi></th>`;
      for(let d=1; d<=31; d++){const on=f.booked.includes(d); h += `<td><button type="button" class="cell ${on?'on':''}" data-v="${v}" data-d="${d}" aria-pressed="${on}" aria-label="${esc(f.name)}, ${d} ${C('month')}, ${on?t('blockedA'):t('freeA')}"></button></td>`;}
      h += '</tr>';
    });
    $('#fleet').innerHTML = h + '</tbody></table>';
    $('#veh').innerHTML = fleet.map((f,v)=>`<button type="button" class="chip ${v===current?'on':''}" data-pick="${v}" dir="ltr">${esc(f.name)}</button>`).join('');
    let m = '<span></span><span></span>';
    for(let d=1; d<=31; d++){const on=fleet[current].booked.includes(d); m += `<button type="button" class="daybtn ${on?'on':''}" data-v="${current}" data-d="${d}" aria-pressed="${on}" aria-label="${d} ${C('month')}, ${on?t('blockedA'):t('freeA')}">${d}</button>`;}
    $('#mcal').innerHTML = m;
    document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => toggle(Number(b.dataset.v), Number(b.dataset.d)));

        <label class="field">${t('model')}<select id="w-model" dir="ltr">${MODELS[draft.brand].map(m=>`<option ${m===draft.model?'selected':''}>${m}</option>`).join('')}</select></label></div>
        <label class="field">${t('year')}<select id="w-year">${['2025','2024','2023','2022','2021','2020','2019'].map(y=>`<option ${y===draft.year?'selected':''}>${y}</option>`).join('')}</select></label>
        <div class="auto"><p>${t('autoFill')}</p><div><span>${t('category')} : <b>${t('t_'+a[0])}</b></span><span>${t('seatsT')} : <b>${a[1]}</b></span><span>${t('fuel')} : <b>${a[2]?t('diesel'):t('petrol')}</b></span><span>${t('doors')} : <b>${a[0]==='utility'&&a[1]>8?4:5}</b></span></div></div>
        ${sel(t('gearT'),[t('auto'),t('manual')],t('auto'))}
        <fieldset style="border:none;margin:0;padding:0"><legend class="field" style="margin-bottom:4px">${t('equip')}</legend>${chk(t('ac'),true)}${chk(t('bt'),true)}${chk(t('cam'),false)}${chk(t('gps'),false)}</fieldset></div>`;
    }
    if(step===2){
      const names = T.slots[I()];
      return `<div style="display:flex;flex-direction:column;gap:14px">
        <h2 style="font-size:20px;font-weight:600">${t('w2')}</h2>
        <p style="color:var(--muted);font-size:14px">${t('w2P')}</p>
        <button class="btn teal" type="button" id="w-shot">${t('shot')}</button>
        <div class="slots">${names.map((n,i)=>`<button type="button" class="slot ${i<shots?'done':''}" data-slot="${i}">${n}${i<shots?' ✓':''}</button>`).join('')}</div></div>`;
    }
    if(step===3){
      return `<div style="display:flex;flex-direction:column;gap:14px">
        <h2 style="font-size:20px;font-weight:600">${t('w3')}</h2>
        <label class="field">${t('ppd',{c:C('cur')})}<input type="number" inputmode="numeric" placeholder="${t('yourPrice')}"></label>
        <div class="two">${sel(t('minDur'),[days(1),days(2),days(3),days(7)],days(2))}
        <label class="field">${t('depositC',{c:C('cur')})}<input type="number" inputmode="numeric" placeholder="${t('amount')}"></label>
        ${sel(t('mileage'),[t('unlimited'),t('km200'),t('km300')],t('unlimited'))}
        ${sel(t('minAge'),[ageY(21),ageY(23),ageY(25)],ageY(25))}
        ${sel(t('licSince'),[years(1),years(2),years(3)],years(3))}
        ${sel(t('driverT'),[t('withoutDriver'),t('withDriver'),t('custChoice')],t('withoutDriver'))}</div>
        ${sel(t('fuel'),[t('sameLevel'),t('fullFull')],t('sameLevel'))}
        ${sel(t('cancel'),[t('c48'),t('c7'),t('cNo')],t('c48'))}
        <fieldset style="border:none;margin:0;padding:0"><legend class="field" style="margin-bottom:4px">${t('servicesT')}</legend>${chk(t('fAirport'),true)}${chk(t('home'),false)}${chk(t('babySeat'),false)}</fieldset></div>`;
    }
    return `<div style="display:flex;flex-direction:column;gap:14px">
      <h2 style="font-size:20px;font-weight:600">${t('w4')}</h2>
      ${sel(t('city'),[C('city')],C('city'))}
      <label class="field">${t('district')}<input type="text" placeholder="${C('district')}"></label>
      <div class="card" style="padding:14px;font-size:14px;display:flex;flex-direction:column;gap:4px"><b style="font-size:15px">${t('recap')}</b><span><bdi>${draft.brand} ${draft.model} ${draft.year}</bdi></span><span>${t('recapL',{n:shots})}</span></div>
      <label class="check" style="align-items:flex-start"><input type="checkbox" id="w-engage" checked style="margin-top:3px"> ${t('engage')}</label></div>`;
  };
  const draw = () => {
    $('#w-n').textContent = t('stepN',{s:step});
    document.querySelectorAll('#w-bars span').forEach((s,i)=>s.classList.toggle('on', i<step));
    $('#w-body').innerHTML = body();
    $('#w-back').style.visibility = step===1?'hidden':'visible';
    $('#w-next').textContent = step===4?t('publish'):t('next');
    if(step===1){
      $('#w-brand').onchange = e => {draft.brand=e.target.value; draft.model=MODELS[draft.brand][0]; draw();};
      $('#w-model').onchange = e => {draft.model=e.target.value; draw();};
      $('#w-year').onchange = e => {draft.year=e.target.value;};
    }
    if(step===2){
      const add = () => {if(shots<6){shots++; draw();}};
      $('#w-shot').onclick = add;
      document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=add);
    }
  };
  $('#w-back').onclick = () => {step=Math.max(1,step-1); draw();};
  $('#w-next').onclick = () => {
    if(step<4){step++; draw(); window.scrollTo(0,0); return;}
    if(!$('#w-engage').checked){toast(t('toastEngage')); return;}
    FLEET[country].push({name:`${draft.brand} ${draft.model} ${draft.year}`, booked:[]});
    current = FLEET[country].length-1;
    location.hash = '#/loueur';
    setTimeout(()=>toast(t('toastPub')),100);
  };
  draw();
}

/* =========================================================
   Navigation
   ========================================================= */
function route(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  header();
  const h = location.hash.replace(/^#\/?/,'');
  const [page, arg] = h.split('/');
  const app = $('#app');
  $('#layer').innerHTML=''; const v=$('#veil'); if(v) v.remove();
  if(page==='resultats'){app.innerHTML=resultsPage(); resultsBind();}
  else if(page==='fiche'){app.innerHTML=detailPage(arg); detailBind(arg);}
  else if(page==='loueur' && arg==='ajout'){app.innerHTML=wizardPage(); wizardBind();}
  else if(page==='loueur'){app.innerHTML=planningPage(); planningBind();}
  else {app.innerHTML=homePage(); homeBind();}
  document.title = lang==='ar' ? 'صفا راحة — استأجر سيارتك براحة بال' : 'SafaRaha — ' + t('heroT');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {if(e.key==='Escape'){ $('#layer').innerHTML=''; const f=$('#filters'); if(f) f.classList.remove('open'); const v=$('#veil'); if(v) v.remove(); }});
route();
</script>
</body>
</html>
